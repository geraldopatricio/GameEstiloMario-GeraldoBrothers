services:
  game:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3001
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}
    expose:
      - "3001"
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - game
